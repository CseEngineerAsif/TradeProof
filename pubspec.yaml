name: tradeproof
description: "TradeProof competency verification platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  image_picker: ^1.2.4
  flutter:
    sdk: flutter
  file_picker: ^13.4.1
  url_launcher: ^6.3.3
  pdfrx: 2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tradeproof_workers.png
    - assets/dashboard_hero_photo.jpg
